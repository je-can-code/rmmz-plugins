name: CI

# Every pull request, and every landing on main. The push trigger is not redundant with the pull
# request one: a squash merge produces a commit nothing has ever run against, since what CI checked
# was the branch rather than the result of collapsing it onto main.
on:
  pull_request:
  push:
    branches:
      - main

# a second push to a branch makes the first run's answer irrelevant, so it is cancelled rather than
# left to finish. main is deliberately not cancelled: every commit that lands there gets its own
# verdict, because that is the history someone will later bisect.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun is the only runtime this repo uses. Some package scripts shell out to node internally,
      # which the Bun action's bundled node satisfies without a separate setup-node step.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # frozen, so a pull request that edited package.json without regenerating bun.lock fails here
      # rather than silently resolving to something nobody has run against.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # lint, the eleven source gates, a clean build of all ships, verify:ships, and the full suite
      # under coverage thresholds. This is `hotfix` minus its final step: hotfix ends by mirroring
      # the build into ../ca/chef-adventure, a sibling checkout that does not exist on a runner.
      - name: Verify
        run: bun run verify:ci

      # the one failure a local hotfix structurally cannot catch. `project/js/plugins/**` is tracked
      # and several tests load those committed bundles rather than source, so a pull request that
      # changes source without committing the rebuilt output produces a suite that passes against
      # stale code and looks perfectly green. Mirroring the fresh build over the committed one and
      # demanding no diff is what turns "commit the full tree" into something enforced.
      - name: Verify built output is committed
        run: bun run verify:no-build-drift
